        function renderTable(data) {
            const tbody = document.getElementById('clinic-list-body');
            tbody.innerHTML = '';

            data.forEach((clinic) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-200";

                let websiteHtml = '';
                if (clinic.website && clinic.website.trim() !== "") {
                    websiteHtml = `<a href="${clinic.website}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 rounded transition-colors"><span>바로가기</span><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></a>`;
                } else {
                    websiteHtml = `<span class="text-slate-300 text-xs">-</span>`;
                }

                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-semibold text-slate-900 align-middle border-r border-slate-200">${clinic.name}</td>
                    <td class="py-2.5 px-4 text-slate-600 align-middle border-r border-slate-200">${clinic.address}</td>
                    <td class="py-2.5 px-4 text-slate-700 font-mono text-xs sm:text-sm align-middle border-r border-slate-200">${clinic.phone}</td>
                    <td class="py-2.5 px-4 text-center align-middle">${websiteHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = function() {
            renderTable(clinicData);
        };
